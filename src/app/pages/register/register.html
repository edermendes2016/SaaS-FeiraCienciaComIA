<div class="login-wrapper">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="login-card glass animate-fade-in-up">
    <div class="brand">
      <div class="brand-icon">🔬</div>
      <h1 class="gradient-text">Criar Conta</h1>
      <p class="brand-subtitle">Junte-se ao laboratório inteligente</p>
    </div>

    <form class="login-form" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="field-group">
        <label for="name">Nome Completo</label>
        <div class="input-wrapper">
          <input type="text" id="name" formControlName="name" placeholder="Seu nome" required>
        </div>
      </div>

      <div class="field-group">
        <label for="email">E-mail</label>
        <div class="input-wrapper">
          <input type="email" id="email" formControlName="email" placeholder="exemplo@email.com" required>
        </div>
      </div>

      <div class="field-group">
        <label for="schoolName">Nome da Escola</label>
        <div class="input-wrapper">
          <input type="text" id="schoolName" formControlName="schoolName" placeholder="Nome da sua escola" required>
        </div>
      </div>

      <div class="grid-2">
        <div class="field-group">
          <label for="role">Eu sou</label>
          <div class="input-wrapper select-wrapper">
            <select id="role" formControlName="role">
              <option value="student">Estudante</option>
              <option value="teacher">Professor</option>
            </select>
          </div>
        </div>

        <div class="field-group" *ngIf="registerForm.get('role')?.value === 'student'">
          <label for="grade">Série/Ano</label>
          <div class="input-wrapper">
            <input type="text" id="grade" formControlName="grade" placeholder="Ex: 9º ano">
          </div>
        </div>
      </div>

      <div class="field-group" *ngIf="registerForm.get('role')?.value === 'student'">
        <label for="class">Turma</label>
        <div class="input-wrapper">
          <input type="text" id="class" formControlName="class" placeholder="Ex: Turma B">
        </div>
      </div>

      <div class="field-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <input type="password" id="password" formControlName="password" placeholder="••••••••" required>
        </div>
        <div class="password-hint" [class.error]="registerForm.get('password')?.invalid && registerForm.get('password')?.dirty">
          ⚠️ Mínimo 8 caracteres, 1 maiúscula, 1 número e 1 caractere especial (!@#$).
        </div>
      </div>

      <div class="error-alert" *ngIf="errorMessage">
        <span>⚠️ {{ errorMessage }}</span>
      </div>

      <button type="submit" class="btn btn-primary btn-full" [disabled]="registerForm.invalid || isLoading">
        <span *ngIf="!isLoading">Criar Minha Conta ✨</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

      <div class="divider">
        <span>Já possui acesso?</span>
      </div>

      <a routerLink="/login" class="btn btn-secondary btn-full">
        <span>← Voltar para o Login</span>
      </a>
    </form>
  </div>
</div>
